name: Contributor gate

# Pull requests from people the maintainers have not vouched for are closed automatically
# with a pointer to CONTRIBUTING.md. Nobody can show up unannounced and get code reviewed,
# let alone merged.
#
# SECURITY: this uses pull_request_target so it can comment and close, but it NEVER checks
# out or runs code from the pull request. It only reads PR metadata and two files from the
# base branch (TRUSTED_CONTRIBUTORS, via the API). Do not add a checkout step here.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const assoc = pr.author_association;
            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(assoc)) {
              core.info(`${author} is ${assoc}: allowed`);
              return;
            }
            if (pr.user.type === "Bot" && ["dependabot[bot]"].includes(author)) {
              core.info("dependabot: allowed");
              return;
            }
            let trusted = [];
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: ".github/TRUSTED_CONTRIBUTORS", ref: pr.base.ref,
              });
              trusted = Buffer.from(data.content, "base64").toString("utf8")
                .split("\n").map(l => l.replace(/#.*/, "").trim().toLowerCase()).filter(Boolean);
            } catch (e) { core.warning("no TRUSTED_CONTRIBUTORS file"); }
            if (trusted.includes(author.toLowerCase())) {
              core.info(`${author} is vouched for: allowed`);
              return;
            }
            const body = [
              `Thanks for your interest in VeraMem, @${author}!`,
              "",
              "To protect users, this project only accepts pull requests from contributors a",
              "maintainer has vouched for. Please open an issue describing what you would like to",
              "change (see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)). Once a maintainer adds",
              "you to `.github/TRUSTED_CONTRIBUTORS`, you can reopen this pull request.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
              labels: ["needs-vouch"],
            }).catch(() => {});
            await github.rest.pulls.update({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
              state: "closed",
            });
            core.setFailed(`${author} is not a vouched contributor`);
