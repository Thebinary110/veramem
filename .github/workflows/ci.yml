name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Least privilege: nothing in CI can write to the repo, packages or releases.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Ruff
        run: |
          uv run --with ruff==0.17.1 ruff check src tests benchmarks
          uv run --with ruff==0.17.1 ruff format --check src tests benchmarks
      - name: Type check
        run: uv run --with mypy==2.4.0 --extra mcp mypy src

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Tests (no network, no model: deterministic fake LLM)
        run: python -m pytest --cov=veramem --cov-report=term-missing
      - name: Gap guarantees benchmark (deterministic)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m benchmarks.guarantees --offline

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          VERAMEM_HOME=/tmp/vh VERAMEM_LLM=none VERAMEM_EMBEDDER=hash /tmp/v/bin/veramem add "smoke test"
          VERAMEM_HOME=/tmp/vh VERAMEM_LLM=none VERAMEM_EMBEDDER=hash /tmp/v/bin/veramem verify
