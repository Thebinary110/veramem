[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veramem"
dynamic = ["version"]
description = "Verifiable, outcome-aware, share-safe long-term memory for AI agents. One file, zero infrastructure."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Shhaurya Jaiswal" }]
keywords = ["llm", "agents", "memory", "rag", "provenance", "mcp", "long-term-memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
auth = ["PyJWT[crypto]>=2.8"]
ann = ["usearch>=2.12"]
postgres = ["psycopg[binary]>=3.2"]
langchain = ["langchain-core>=1.0"]
langgraph = ["langgraph>=1.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "hypothesis>=6.100",
  "pytest-xdist>=3.6",
  "PyJWT[crypto]>=2.8",
]

[project.scripts]
veramem = "veramem.cli:app"

[project.urls]
Homepage = "https://github.com/Thebinary110/veramem"
Issues = "https://github.com/Thebinary110/veramem/issues"
Security = "https://github.com/Thebinary110/veramem/security/policy"

[tool.hatch.version]
path = "src/veramem/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/veramem"]

[tool.hatch.build.targets.sdist]
include = ["src/veramem", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608", "B008", "B905", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"benchmarks/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["sqlite_only: behaviour specific to the SQLite file backend"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.bandit]
# B608 (SQL built with f-strings) is a false positive here: every value is a bound "?"
# parameter, and interpolated identifiers are checked against allowlists in store/sqlite.py.
skips = ["B608"]

[tool.coverage.run]
# exercised in their own CI jobs (PostgreSQL service; framework extras), not the main matrix
omit = ["src/veramem/integrations/*", "src/veramem/store/postgres.py"]
