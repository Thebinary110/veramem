[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veramem"
dynamic = ["version"]
description = "Verifiable, outcome-aware, share-safe long-term memory for AI agents. One file, zero infrastructure."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Shhaurya Jaiswal" }]
keywords = ["llm", "agents", "memory", "rag", "provenance", "mcp", "long-term-memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
veramem = "veramem.cli:app"

[project.urls]
Homepage = "https://github.com/Thebinary110/veramem"
Issues = "https://github.com/Thebinary110/veramem/issues"
Security = "https://github.com/Thebinary110/veramem/security/policy"

[tool.hatch.version]
path = "src/veramem/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/veramem"]

[tool.hatch.build.targets.sdist]
include = ["src/veramem", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608", "B008", "B905", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"benchmarks/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
